<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate Portal — Home</title>
<link rel="stylesheet" href="css/style.css?v=20260901b">
</head>
<body>
  <div class="topbar">
    <div class="brand">Candidate Portal</div>
    <div class="who">
      <span id="whoami"></span>
      <button onclick="candidateLogout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <h2>Your Application Status</h2>
    <div class="status-track" id="statusTrack"></div>

    <div class="card" id="rejectedCard" style="display:none;">
      <strong style="color:#b91c1c;">Your application is not proceeding further.</strong>
      <p style="color:#6b7280;">Thank you for your interest. HR will reach out if anything further is needed.</p>
    </div>

    <!-- Fields HR has unlocked on an already-submitted form -->
    <div class="card correction-card hidden" id="correctionsCard">
      <div class="correction-head">
        <div>
          <div class="ft-name">Corrections requested by HR</div>
          <div class="ft-desc" id="correctionsSummary"></div>
        </div>
        <button class="btn btn-primary btn-small"
          onclick="window.location.href='my-corrections.html'">Make Corrections</button>
      </div>
    </div>

    <div id="formTiles"></div>
  </div>

  <script src="../js/config.js?v=20260901b"></script>
  <script src="js/api.js?v=20260901b"></script>
  <script>
    requireAuth();
    document.getElementById("whoami").textContent = getName();

    const STEPS = ["INVITED", "CIF_SUBMITTED", "APPROVED_FOR_BGV", "ONBOARDING_COMPLETE"];
    const STEP_LABELS = {
      INVITED: "Invited", CIF_SUBMITTED: "CIF Submitted",
      APPROVED_FOR_BGV: "Cleared Final Round", ONBOARDING_COMPLETE: "Onboarding Complete",
    };

    const FORM_META = {
      CIF: { title: "Candidate Information Form (CIF)", desc: "Your personal, education and identity details.", page: "cif-form.html" },
      BGV: { title: "Background Verification Form", desc: "Employment history and reference details for verification.", page: "bgv-form.html" },
      DOCUMENT_COLLECTION: { title: "Document Collection Form", desc: "Upload your ID proof, resume and other documents.", page: "document-form.html" },
    };

    function renderTrack(stage) {
      const track = document.getElementById("statusTrack");
      track.innerHTML = "";
      if (stage === "REJECTED") {
        document.getElementById("rejectedCard").style.display = "block";
        track.innerHTML = `<div class="status-step blocked">Application Closed</div>`;
        return;
      }
      const currentIdx = STEPS.indexOf(stage);
      STEPS.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "status-step " + (i < currentIdx ? "done" : i === currentIdx ? "active" : "");
        div.textContent = STEP_LABELS[s];
        track.appendChild(div);
      });
    }

    function statusBadgeText(status) {
      return status.replaceAll("_", " ");
    }

    // Show the forms in the order they must be completed, not DB order.
    const FORM_ORDER = ["CIF", "DOCUMENT_COLLECTION", "BGV"];

    function renderTiles(forms) {
      const container = document.getElementById("formTiles");
      container.innerHTML = "";
      const ordered = FORM_ORDER
        .map(t => forms.find(f => f.form_type === t))
        .filter(Boolean);
      ordered.forEach(f => {
        const meta = FORM_META[f.form_type];
        if (f.status === "LOCKED") {
          // Show it greyed out so the candidate knows what is still to come.
          const locked = document.createElement("div");
          locked.className = "card form-tile";
          locked.style.opacity = "0.6";
          locked.innerHTML = `
            <div>
              <div class="ft-name">${meta.title}</div>
              <div class="ft-desc">${meta.desc}</div>
              <div class="ft-desc" style="color:#b45309;margin-top:4px;">
                Unlocks after HR approves your documents.</div>
            </div>
            <div style="text-align:right;">
              <div class="badge badge-locked">LOCKED</div>
            </div>`;
          container.appendChild(locked);
          return;
        }
        const tile = document.createElement("div");
        tile.className = "card form-tile";
        const canFill = f.status === "PENDING";
        // Every form is frozen once submitted — corrections go through a value
        // HR opens for you, so there is no "Edit" here any more.
        const label = canFill ? "Fill Form" : "View";
        const note = canFill
          ? ""
          : "<div class='ft-desc' style='color:#6b7280;margin-top:4px;'>Submitted and locked. "
            + "To change something, ask HR to open that field for you.</div>";
        tile.innerHTML = `
          <div>
            <div class="ft-name">${meta.title}</div>
            <div class="ft-desc">${meta.desc}</div>
            ${note}
          </div>
          <div style="text-align:right;">
            <div class="badge badge-${f.status.toLowerCase()}" style="margin-bottom:8px;">${statusBadgeText(f.status)}</div><br>
            <button class="btn ${canFill ? "btn-primary" : "btn-outline"} btn-small"
              ${canFill ? "" : "disabled"}
              onclick="window.location.href='${meta.page}'">${label}</button>
          </div>`;
        container.appendChild(tile);
      });
    }

    function renderCorrections(permissions) {
      const card = document.getElementById("correctionsCard");
      if (!permissions.length) { card.classList.add("hidden"); return; }
      const note = permissions.find(p => p.hr_note);
      document.getElementById("correctionsSummary").textContent =
        `HR has unlocked ${permissions.length} value(s) for you to correct.`
        + (note ? ` “${note.hr_note}”` : "")
        + " You will be asked why you are changing each one.";
      card.classList.remove("hidden");
    }

    async function load() {
      const data = await apiFetch("/candidate/me/status");
      renderTrack(data.stage);
      if (data.stage !== "REJECTED") renderTiles(data.forms);
      // A failure here must not take the status page down with it.
      try {
        const access = await apiFetch("/candidate/me/edit-access");
        renderCorrections(access.permissions || []);
      } catch (e) { /* nothing unlocked, or offline */ }
    }

    load().catch(err => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.color = "#b91c1c";
      card.textContent = `Could not load your status: ${err.message} — refresh the page to try again.`;
      const tiles = document.getElementById("formTiles");
      tiles.innerHTML = "";
      tiles.appendChild(card);
    });
  </script>
</body>
</html>
