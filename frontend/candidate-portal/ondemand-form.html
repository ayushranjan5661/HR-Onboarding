<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<title>Consultant Form</title>
<link rel="stylesheet" href="css/style.css?v=20261104n">
<link rel="stylesheet" href="css/theme.css?v=20261104n">
<style>
  .form-card { max-width: 1000px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Candidate Portal</div>
    <div class="who">
      <span id="whoami"></span>
      <button onclick="candidateLogout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="card form-card" style="margin-top:14px;">
      <h2>Consultant Form <span id="consultantType" class="badge badge-pending hidden"
        style="font-size:0.75rem;vertical-align:middle;margin-left:6px;"></span></h2>
      <p id="formIntro" style="color:#6b7280;font-size:0.85rem;">
        Your contact details, identity documents and the bank account we should pay into.
      </p>

      <form id="ondemandForm" enctype="multipart/form-data">
        <div class="form-section">
          <h3>Personal Details</h3>
          <div class="grid-2">
            <div><label>Name *</label><input name="full_name" required></div>
            <div><label>Date of Birth *</label><input data-date name="date_of_birth" required></div>
            <div><label>Email *</label><input type="email" name="email" required></div>
            <div><label>Alternate Email</label><input type="email" name="alternate_email"></div>
            <div><label>Contact Number *</label><input type="tel" name="contact_number" required></div>
            <div><label>Alternate Contact Number</label><input type="tel" name="alternate_number"></div>
            <div><label>LinkedIn</label><input type="url" name="linkedin_link" placeholder="https://www.linkedin.com/in/..."></div>
            <div id="bloodGroupBox" class="hidden"><label>Blood Group *</label>
              <select name="blood_group" disabled>
                <option value="">Select</option><option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
              </select></div>
          </div>
        </div>

        <div class="form-section">
          <h3>Documents</h3>
          <!-- Which uploads show, their order and which are mandatory depend on
               the consultant type HR picked (consultant_layout from /me/status). -->
          <div class="grid-2" id="docGrid">
            <div data-doc="aadhar_card"><label>Aadhar Card<span class="req"></span></label>
              <input type="file" name="aadhar_card" accept="image/*,.pdf,.doc,.docx"></div>
            <div data-doc="pan_card"><label>PAN Card<span class="req"></span></label>
              <input type="file" name="pan_card" accept="image/*,.pdf,.doc,.docx"></div>
            <div data-doc="passport_size_photo"><label>Passport Size Photo<span class="req"></span></label>
              <input type="file" name="passport_size_photo" accept=".jpg,.jpeg,.png,.gif">
              <div class="file-hint">Files supported: JPG, PNG, GIF, JPEG &bull; Max. size is 10 MB</div></div>
            <div data-doc="resume"><label>Resume<span class="req"></span></label>
              <input type="file" name="resume" accept=".pdf,.doc,.docx"></div>
            <div data-doc="sow"><label>SOW<span class="req"></span></label>
              <input type="file" name="sow" accept="image/*,.pdf,.doc,.docx"></div>
            <div data-doc="nda"><label>NDA<span class="req"></span></label>
              <input type="file" name="nda" accept="image/*,.pdf,.doc,.docx"></div>
            <div data-doc="msa"><label>MSA<span class="req"></span></label>
              <input type="file" name="msa" accept="image/*,.pdf,.doc,.docx"></div>
            <div data-doc="approval_mail"><label><span class="doc-label">Approval Mail</span><span class="req"></span></label>
              <input type="file" name="approval_mail" accept="image/*,.pdf,.doc,.docx"></div>
            <div data-doc="other_documents"><label>Other Documents<span class="req"></span></label>
              <input type="file" name="other_documents" accept="image/*,.pdf,.doc,.docx"></div>
          </div>
        </div>

        <div class="form-section" id="bankSection">
          <h3>Bank Details</h3>
          <div class="grid-2">
            <div><label>Name as per Bank</label><input name="bank_account_name"></div>
            <div><label>Bank Name</label><input name="bank_name"></div>
            <div><label>Account Number</label><input name="bank_account_number" inputmode="numeric"></div>
            <div><label>IFSC Code</label><input name="bank_ifsc_code"
              pattern="[A-Za-z]{4}0[A-Za-z0-9]{6}" title="11 characters, e.g. SBIN0001234"></div>
            <div><label>Account Type</label>
              <select name="bank_account_type"><option value="">Select</option><option>Savings</option><option>Current</option></select></div>
            <div><label>Branch</label><input name="bank_branch"></div>
          </div>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit" style="padding:10px 30px;">Submit Form</button>
          <button class="btn btn-outline" type="button" id="saveDraftBtn">Save Draft</button>
        </div>
        <div class="file-hint" id="draftStatus" style="margin-top:6px;"></div>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script src="../js/config.js?v=20261007b"></script>
  <script src="../js/date-format.js?v=20261028a"></script>
  <script src="js/api.js?v=20260929c"></script>
  <script src="js/dialog.js?v=20260901b"></script>
  <script src="js/doc-viewer.js?v=20261005a"></script>
  <script src="js/edit-mode.js?v=20261007a"></script>
  <script src="js/auto-fill.js?v=20261123a"></script>
  <script src="js/draft.js?v=20261007a"></script>
  <script>
    requireAuth();
    document.getElementById("whoami").textContent = getName();

    const formEl = document.getElementById("ondemandForm");
    // Save Draft must work before any network call finishes.
    wireDraftSave({ formType: "ONDEMAND", formEl });

    // Same as _DEFAULT_LAYOUT in backend/app/form_definitions.py.
    const DEFAULT_LAYOUT = {
      docs: ["aadhar_card", "pan_card", "passport_size_photo", "resume", "sow", "nda", "msa",
             "approval_mail", "other_documents"],
      required_docs: ["aadhar_card", "passport_size_photo"],
      bank: true,
      blood_group: false,
      doc_labels: { approval_mail: "Offer Approval Mail" },
    };

    // Show only this consultant type's uploads, in its order, and mark the
    // mandatory ones. Hidden inputs are disabled so they never submit.
    function applyLayout(layout) {
      const grid = document.getElementById("docGrid");
      for (const box of grid.querySelectorAll("[data-doc]")) {
        const input = box.querySelector("input");
        box.classList.add("hidden");
        input.disabled = true;
        input.required = false;
      }
      for (const key of layout.docs) {
        const box = grid.querySelector(`[data-doc="${key}"]`);
        if (!box) continue;
        const input = box.querySelector("input");
        const required = layout.required_docs.includes(key);
        box.classList.remove("hidden");
        input.disabled = false;
        input.required = required;
        box.querySelector(".req").textContent = required ? " *" : "";
        const label = box.querySelector(".doc-label");
        if (label) {
          label.dataset.default ??= label.textContent;
          label.textContent = (layout.doc_labels || {})[key] || label.dataset.default;
        }
        grid.appendChild(box);   // follow the layout's order
      }
      const blood = document.getElementById("bloodGroupBox");
      const bloodSelect = blood.querySelector("select");
      blood.classList.toggle("hidden", !layout.blood_group);
      bloodSelect.disabled = !layout.blood_group;
      bloodSelect.required = !!layout.blood_group;
      const bank = document.getElementById("bankSection");
      bank.classList.toggle("hidden", !layout.bank);
      for (const el of bank.querySelectorAll("input, select")) el.disabled = !layout.bank;
      document.getElementById("formIntro").textContent = layout.bank
        ? "Your contact details, identity documents and the bank account we should pay into."
        : "Your contact details and documents.";
    }

    function setIfEmpty(name, value) {
      const el = formEl.querySelector(`[name="${name}"]`);
      if (el && !el.value && value) el.value = value;
    }

    (async () => {
      const data = await apiFetch("/candidate/me/status");
      const sub = data.forms.find(f => f.form_type === "ONDEMAND");
      if (!sub || sub.status === "LOCKED") {
        await showAlert("This form is not available yet.", { title: "Not available", tone: "info" });
        window.location.href = "home.html"; return;
      }
      if (sub.status !== "PENDING") {
        await showAlert("You have already submitted this form, so it can no longer be "
                        + "edited here. If something needs correcting, ask HR to open "
                        + "that field for you.",
                        { title: "Already submitted", tone: "info" });
        window.location.href = "home.html"; return;
      }

      applyLayout(data.consultant_layout || DEFAULT_LAYOUT);
      if (data.consultant_type_label) {
        document.getElementById("consultantType").textContent = data.consultant_type_label;
        document.getElementById("consultantType").classList.remove("hidden");
      }

      // Name and email HR entered on the invite.
      if (data.profile) {
        setIfEmpty("full_name", data.profile.full_name);
        setIfEmpty("email", data.profile.email);
      }

      await offerDraftRestore({ formType: "ONDEMAND", formEl });
    })().catch(err => {
      document.getElementById("errorMsg").textContent =
        "Could not load the form: " + err.message + " — refresh the page to try again.";
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "";
      try {
        await apiFetch("/candidate/forms/ONDEMAND/submit",
                       { method: "POST", body: new FormData(formEl) });
        await clearFormDraft("ONDEMAND");
        await showAlert("HR will review it.", { title: "Consultant Form submitted successfully" });
        window.location.href = "home.html";
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
