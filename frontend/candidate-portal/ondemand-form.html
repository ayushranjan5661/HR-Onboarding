<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<title>On-Demand Candidate Form</title>
<link rel="stylesheet" href="css/style.css?v=20261008a">
<style>
  .form-card { max-width: 1000px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Candidate Portal</div>
    <div class="who">
      <span id="whoami"></span>
      <button onclick="candidateLogout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="card form-card" style="margin-top:14px;">
      <h2>On-Demand Candidate Form</h2>
      <p style="color:#6b7280;font-size:0.85rem;">
        Your contact details, identity documents and the bank account we should pay into.
      </p>

      <form id="ondemandForm" enctype="multipart/form-data">
        <div class="form-section">
          <h3>Personal Details</h3>
          <div class="grid-2">
            <div><label>Name *</label><input name="full_name" required></div>
            <div><label>Date of Birth *</label><input data-date name="date_of_birth" required></div>
            <div><label>Email *</label><input type="email" name="email" required></div>
            <div><label>Alternate Email</label><input type="email" name="alternate_email"></div>
            <div><label>Contact Number *</label><input type="tel" name="contact_number" required></div>
            <div><label>Alternate Contact Number</label><input type="tel" name="alternate_number"></div>
            <div><label>LinkedIn</label><input type="url" name="linkedin_link" placeholder="https://www.linkedin.com/in/..."></div>
          </div>
        </div>

        <div class="form-section">
          <h3>Documents</h3>
          <div class="grid-2">
            <div>
              <label>Aadhar Card *</label>
              <input type="file" name="aadhar_card" accept="image/*,.pdf,.doc,.docx" required>
            </div>
            <div>
              <label>PAN Card *</label>
              <input type="file" name="pan_card" accept="image/*,.pdf,.doc,.docx" required>
            </div>
            <div>
              <label>Candidate Photo *</label>
              <input type="file" name="passport_size_photo" accept=".jpg,.jpeg,.png,.gif" required>
              <div class="file-hint">Files supported: JPG, PNG, GIF, JPEG &bull; Max. size is 10 MB</div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3>Bank Details</h3>
          <div class="grid-2">
            <div><label>Name as per Bank *</label><input name="bank_account_name" required></div>
            <div><label>Account Number *</label><input name="bank_account_number" inputmode="numeric" required></div>
            <div><label>IFSC Code *</label><input name="bank_ifsc_code" required
              pattern="[A-Za-z]{4}0[A-Za-z0-9]{6}" title="11 characters, e.g. SBIN0001234"></div>
            <div><label>Account Type *</label>
              <select name="bank_account_type" required><option value="">Select</option><option>Savings</option><option>Current</option></select></div>
            <div><label>Branch *</label><input name="bank_branch" required></div>
          </div>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit" style="padding:10px 30px;">Submit Form</button>
          <button class="btn btn-outline" type="button" id="saveDraftBtn">Save Draft</button>
        </div>
        <div class="file-hint" id="draftStatus" style="margin-top:6px;"></div>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script src="../js/config.js?v=20261007b"></script>
  <script src="../js/date-format.js?v=20261025a"></script>
  <script src="js/api.js?v=20260929c"></script>
  <script src="js/dialog.js?v=20260901b"></script>
  <script src="js/doc-viewer.js?v=20261005a"></script>
  <script src="js/edit-mode.js?v=20261007a"></script>
  <script src="js/auto-fill.js?v=20261026a"></script>
  <script src="js/draft.js?v=20261007a"></script>
  <script>
    requireAuth();
    document.getElementById("whoami").textContent = getName();

    const formEl = document.getElementById("ondemandForm");
    // Save Draft must work before any network call finishes.
    wireDraftSave({ formType: "ONDEMAND", formEl });

    function setIfEmpty(name, value) {
      const el = formEl.querySelector(`[name="${name}"]`);
      if (el && !el.value && value) el.value = value;
    }

    (async () => {
      const data = await apiFetch("/candidate/me/status");
      const sub = data.forms.find(f => f.form_type === "ONDEMAND");
      if (!sub || sub.status === "LOCKED") {
        await showAlert("This form is not available yet.", { title: "Not available", tone: "info" });
        window.location.href = "home.html"; return;
      }
      if (sub.status !== "PENDING") {
        await showAlert("You have already submitted this form, so it can no longer be "
                        + "edited here. If something needs correcting, ask HR to open "
                        + "that field for you.",
                        { title: "Already submitted", tone: "info" });
        window.location.href = "home.html"; return;
      }

      // Name and email HR entered on the invite.
      if (data.profile) {
        setIfEmpty("full_name", data.profile.full_name);
        setIfEmpty("email", data.profile.email);
      }

      await offerDraftRestore({ formType: "ONDEMAND", formEl });
    })().catch(err => {
      document.getElementById("errorMsg").textContent =
        "Could not load the form: " + err.message + " — refresh the page to try again.";
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "";
      try {
        await apiFetch("/candidate/forms/ONDEMAND/submit",
                       { method: "POST", body: new FormData(formEl) });
        await clearFormDraft("ONDEMAND");
        await showAlert("HR will review it.", { title: "On-Demand Candidate Form submitted successfully" });
        window.location.href = "home.html";
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
