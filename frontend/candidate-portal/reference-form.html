<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3730a3">
<title>Reference Check Form</title>
<link rel="stylesheet" href="css/style.css?v=20261008a">
<style>
  .form-card { max-width: 1000px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Candidate Portal</div>
    <div class="who">
      <span id="whoami"></span>
      <button onclick="candidateLogout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="card form-card" style="margin-top:14px;">
      <h2>Reference Check Form</h2>
      <p style="color:#6b7280;font-size:0.85rem;">
        Give two professional references we can contact. Your name and position are carried over from your CIF.
      </p>

      <form id="refForm" enctype="multipart/form-data">
        <div class="form-section">
          <h3>Candidate Details</h3>
          <div class="grid-2">
            <div><label>Candidate Name *</label><input name="candidate_name" required></div>
            <div><label>Date *</label><input data-date name="reference_check_date" required></div>
            <div><label>Position Applied For *</label><input name="position_applied_for" required></div>
          </div>
        </div>

        <div class="form-section">
          <h3>Referee Detail 1</h3>
          <div class="grid-2">
            <div><label>Referee Name *</label><input name="ref1_name" required></div>
            <div><label>Title *</label><input name="ref1_title" required placeholder="e.g. Engineering Manager"></div>
            <div><label>Referee Mail ID *</label><input type="email" name="ref1_email" required></div>
            <div><label>Referee Phone No. *</label><input type="tel" name="ref1_phone" required></div>
          </div>
        </div>

        <div class="form-section">
          <h3>Referee Detail 2</h3>
          <div class="grid-2">
            <div><label>Referee Name *</label><input name="ref2_name" required></div>
            <div><label>Title *</label><input name="ref2_title" required placeholder="e.g. Team Lead"></div>
            <div><label>Referee Mail ID *</label><input type="email" name="ref2_email" required></div>
            <div><label>Referee Phone No. *</label><input type="tel" name="ref2_phone" required></div>
          </div>
        </div>

        <div class="form-section">
          <h3>Message to Hiring Team</h3>
          <label>Anything the hiring team should know before contacting your references (optional)</label>
          <textarea name="message_to_hiring_team" rows="4" maxlength="2000"
            placeholder="e.g. Best time to call, notice before contacting my current manager, etc."></textarea>
        </div>

        <div class="form-section">
          <h3>Declaration</h3>
          <div class="checkbox-row">
            <input type="checkbox" id="decl" name="declaration_accepted" value="Yes" required>
            <label for="decl">I hereby declare that the information provided above is true, correct and complete
              to the best of my knowledge. I authorise LevelShift to contact the references listed above, and I
              understand that any false or misleading information may lead to withdrawal of the offer or
              termination of employment. *</label>
          </div>
        </div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit" style="padding:10px 30px;">Submit Reference Check</button>
          <button class="btn btn-outline" type="button" id="saveDraftBtn">Save Draft</button>
        </div>
        <div class="file-hint" id="draftStatus" style="margin-top:6px;"></div>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script src="../js/config.js?v=20261007b"></script>
  <script src="../js/date-format.js?v=20261007r"></script>
  <script src="js/api.js?v=20260929c"></script>
  <script src="js/dialog.js?v=20260901b"></script>
  <script src="js/doc-viewer.js?v=20261005a"></script>
  <script src="js/edit-mode.js?v=20261007a"></script>
  <script src="js/auto-fill.js?v=20261007r"></script>
  <script src="js/draft.js?v=20261007a"></script>
  <script>
    requireAuth();
    document.getElementById("whoami").textContent = getName();

    const formEl = document.getElementById("refForm");
    // Save Draft must work before any network call finishes.
    wireDraftSave({ formType: "REFERENCE_CHECK", formEl });

    function setIfEmpty(name, value) {
      const el = formEl.querySelector(`[name="${name}"]`);
      if (el && !el.value && value) el.value = value;
    }

    (async () => {
      const data = await apiFetch("/candidate/me/status");
      const sub = data.forms.find(f => f.form_type === "REFERENCE_CHECK");
      if (!sub || sub.status === "LOCKED") {
        await showAlert("This form is not available yet.", { title: "Not available", tone: "info" });
        window.location.href = "home.html"; return;
      }
      if (sub.status !== "PENDING") {
        await showAlert("You have already submitted this form, so it can no longer be "
                        + "edited here. If something needs correcting, ask HR to open "
                        + "that field for you.",
                        { title: "Already submitted", tone: "info" });
        window.location.href = "home.html"; return;
      }

      // Carry the CIF answers forward so nothing is typed twice.
      if (data.profile) setIfEmpty("candidate_name", data.profile.full_name);
      try {
        const cif = await apiFetch("/candidate/me/submission/CIF");
        setIfEmpty("position_applied_for", (cif.fields || {}).position_applied_for);
      } catch (err) { /* no CIF answers to carry over */ }
      const d = new Date();
      setIfEmpty("reference_check_date",
                 [d.getDate(), d.getMonth() + 1].map(n => String(n).padStart(2, "0")).join("/")
                 + "/" + d.getFullYear());

      await offerDraftRestore({ formType: "REFERENCE_CHECK", formEl });
    })().catch(err => {
      document.getElementById("errorMsg").textContent =
        "Could not load the form: " + err.message + " — refresh the page to try again.";
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = "";
      try {
        await apiFetch("/candidate/forms/REFERENCE_CHECK/submit",
                       { method: "POST", body: new FormData(formEl) });
        await clearFormDraft("REFERENCE_CHECK");
        await showAlert("HR will review it.", { title: "Reference Check submitted successfully" });
        window.location.href = "home.html";
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
