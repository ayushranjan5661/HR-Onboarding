<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LevelShift Onboarding — Change Password</title>
<link rel="stylesheet" href="hr-portal/css/style.css?v=20260923a">
</head>
<body>
  <div class="login-wrap">
    <div class="login-mark"><img src="assets/logo-white.svg?v=20260825l" alt="LevelShift" class="mark-logo"></div>

    <div class="login-shell">
      <div class="login-card">
        <h1 id="title">Choose your password</h1>
        <p class="sub" id="sub">You signed in with a password that was generated for you. Pick your own to continue.</p>

        <form id="form">
          <label for="current">Current password</label>
          <input type="password" id="current" required autocomplete="current-password">
          <label for="new1">New password</label>
          <input type="password" id="new1" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
          <label for="new2">Repeat new password</label>
          <input type="password" id="new2" required minlength="8" autocomplete="new-password">
          <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Save and continue</button>
          <div class="error-msg" id="errorMsg"></div>
        </form>
        <div style="margin-top:14px;text-align:center;font-size:0.85rem;">
          <a href="#" id="backLink" class="back-link hidden">&larr; Back</a>
          <a href="#" id="logoutLink" class="back-link">Log out</a>
        </div>
      </div>
    </div>

    <div class="login-foot">© LevelShift · Internal Use</div>
  </div>

  <script src="js/config.js?v=20260923a"></script>
  <script>
    // Reached in two ways: forced, straight after a first login with a
    // generated password (nothing else works until it is changed), or by
    // choice from a portal. Only the copy differs.
    const STAFF_HOME = {
      SUPER_ADMIN: "super-admin/users.html",
      MANAGER: "manager/candidates.html",
      HR: "hr-portal/dashboard.html",
    };
    const token = sessionStorage.getItem("staff_token");
    const role = sessionStorage.getItem("staff_role") || "HR";
    const forced = new URLSearchParams(location.search).get("forced") === "1";
    if (!token) window.location.href = "index.html";

    if (!forced) {
      document.getElementById("title").textContent = "Change your password";
      document.getElementById("sub").textContent = "Enter your current password, then the new one.";
      const back = document.getElementById("backLink");
      back.classList.remove("hidden");
      back.href = STAFF_HOME[role] || STAFF_HOME.HR;
      back.style.marginRight = "16px";
    }

    document.getElementById("logoutLink").onclick = (e) => {
      e.preventDefault();
      ["staff_token", "staff_name", "staff_role"].forEach(k => sessionStorage.removeItem(k));
      window.location.href = "index.html";
    };

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("errorMsg");
      err.textContent = "";
      const n1 = document.getElementById("new1").value;
      const n2 = document.getElementById("new2").value;
      if (n1 !== n2) { err.textContent = "The two new passwords do not match."; return; }
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/auth/staff/change-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ current_password: document.getElementById("current").value, new_password: n1 }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          ["staff_token", "staff_name", "staff_role"].forEach(k => sessionStorage.removeItem(k));
          window.location.href = "index.html";
          return;
        }
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Could not change the password.");
        window.location.href = STAFF_HOME[data.role || role] || STAFF_HOME.HR;
      } catch (ex) {
        err.textContent = ex.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
